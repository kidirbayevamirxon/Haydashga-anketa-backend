services:
  postgres:
    image: postgres:17-alpine
    container_name: haydash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: haydash_anketa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - /home/xursand/apps/haydash/pgdata:/var/lib/postgresql/data
    networks:
      - haydash-network
      - shared_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haydash-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/haydash_anketa
      SECRET_KEY: super-secret-key-change-me
      CORS_ORIGINS: "*"
    networks:
      - haydash-network
      - shared_network

  frontend:
    build:
      context: ../Haydashga-anketa-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: haydash-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - haydash-network
      - shared_network

networks:
  haydash-network:
    driver: bridge
  shared_network:
    external: true

volumes:
  postgres_data:
