services:
  postgres:
    image: postgres:17-alpine
    container_name: haydash-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: haydash_anketa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
